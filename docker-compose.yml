version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: admin-pro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin789}
      MYSQL_DATABASE: ${DB_NAME:-adminpro}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-admin789}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - admin-pro-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admin-pro-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-admin789}
      - DB_NAME=${DB_NAME:-adminpro}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_change_this}
      - JWT_EXPIRE=${JWT_EXPIRE:-24}
      - SERVER_PORT=:8080
      - SERVER_MODE=${SERVER_MODE:-release}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - admin-pro-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Frontend (optional - build and serve)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: admin-pro-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - admin-pro-network

volumes:
  mysql_data:
    driver: local

networks:
  admin-pro-network:
    driver: bridge
