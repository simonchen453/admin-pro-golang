basePath: /
definitions:
  entity.Config:
    properties:
      createdBy:
        type: string
      createdDate:
        type: string
      id:
        type: string
      isSystem:
        description: 1=是 0=否
        type: integer
      key:
        type: string
      name:
        type: string
      remark:
        type: string
      updatedBy:
        type: string
      updatedDate:
        type: string
      value:
        type: string
    type: object
  entity.Dept:
    properties:
      children:
        items:
          $ref: '#/definitions/entity.Dept'
        type: array
      createdBy:
        type: string
      createdDate:
        type: string
      email:
        maxLength: 100
        type: string
      id:
        type: string
      leader:
        maxLength: 50
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
      orderNum:
        minimum: 0
        type: integer
      parentId:
        type: string
      phone:
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
      updatedBy:
        type: string
      updatedDate:
        type: string
    required:
    - name
    type: object
  entity.Job:
    properties:
      beanName:
        maxLength: 100
        minLength: 2
        type: string
      createdTime:
        type: string
      cronExpression:
        maxLength: 100
        type: string
      id:
        type: string
      methodName:
        maxLength: 100
        minLength: 2
        type: string
      params:
        maxLength: 500
        type: string
      remark:
        maxLength: 500
        type: string
      status:
        description: 0:正常 1:暂停
        enum:
        - 0
        - 1
        type: integer
    required:
    - beanName
    - cronExpression
    - methodName
    type: object
  entity.Menu:
    properties:
      children:
        items:
          $ref: '#/definitions/entity.Menu'
        type: array
      display:
        maxLength: 100
        minLength: 2
        type: string
      icon:
        maxLength: 50
        type: string
      id:
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
      orderNum:
        minimum: 0
        type: integer
      parentId:
        type: string
      permission:
        maxLength: 100
        type: string
      status:
        enum:
        - "0"
        - "1"
        type: string
      type:
        description: M目录 C菜单 F按钮
        enum:
        - M
        - C
        - F
        type: string
      url:
        maxLength: 255
        type: string
      visible:
        enum:
        - "0"
        - "1"
        type: string
    required:
    - display
    - name
    - type
    type: object
  entity.Notice:
    properties:
      content:
        type: string
      createdBy:
        type: string
      createdDate:
        type: string
      endTime:
        type: string
      id:
        type: string
      startTime:
        type: string
      title:
        type: string
      updatedBy:
        type: string
      updatedDate:
        type: string
      userDomain:
        type: string
    type: object
  entity.Post:
    properties:
      code:
        type: string
      createdBy:
        type: string
      createdDate:
        type: string
      id:
        type: string
      name:
        type: string
      remark:
        type: string
      sort:
        type: integer
      status:
        type: string
      updatedBy:
        type: string
      updatedDate:
        type: string
    type: object
  entity.Role:
    properties:
      createdDate:
        type: string
      display:
        maxLength: 100
        minLength: 2
        type: string
      id:
        type: string
      isSystem:
        type: boolean
      name:
        maxLength: 50
        minLength: 2
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
    required:
    - display
    - name
    type: object
  response.Response:
    properties:
      data: {}
      message:
        type: string
      restCode:
        type: string
    type: object
  v1.LoginRequest:
    properties:
      loginName:
        description: 必填校验
        type: string
      password:
        type: string
    required:
    - loginName
    - password
    type: object
host: localhost:8080
info:
  contact:
    email: simonchen453@gmail.com
    name: API Support
  description: 基于 Clean Architecture 的企业级后台管理系统 API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Admin Pro Golang API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录凭证
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登出
      tags:
      - auth
  /api/v1/auth/userinfo:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - user
  /api/v1/generator/batchGenCode:
    get:
      parameters:
      - description: 表名列表(逗号分隔)
        in: query
        name: tables
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: 批量生成代码
      tags:
      - generator
  /api/v1/generator/list:
    get:
      parameters:
      - description: 表名
        in: query
        name: tableName
        type: string
      - description: 页码
        in: query
        name: pageNo
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取数据表列表
      tags:
      - generator
  /api/v1/job:
